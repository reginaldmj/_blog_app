{% extends 'base.html' %}

{% block content %}

<h1>Blog Posts</h1>

{% for post in posts %}

<div class="card mb-3">
    <div class="card-body">
        <h3>{{ post.title }}</h3>

        <p>{{ post.content }}</p>

        <small>
            Created by {{ post.author.username }}
        </small>
    </div>
</div>

{% endfor %}

{% endblock %}
