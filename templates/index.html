{% extends 'base.html' %}

{% block content %}

<h1 class="mb-4">Blog Posts</h1>

{% for post in posts %}

<div class="card mb-3">

    <div class="card-body">

        <h3>{{ post.title }}</h3>

        <p>{{ post.content }}</p>

        <small>
            Created by {{ post.author.username }}
        </small>

        <div class="mt-3">

            {% if current_user.is_authenticated and post.author == current_user %}

                <a
                    href="/edit-post/{{ post.id }}"
                    class="btn btn-warning btn-sm"
                >
                    Edit
                </a>

                <a
                    href="/delete-post/{{ post.id }}"
                    class="btn btn-danger btn-sm"
                >
                    Delete
                </a>

            {% endif %}

        </div>

    </div>

</div>

{% endfor %}

{% endblock %}
