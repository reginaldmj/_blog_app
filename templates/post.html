{% extends 'base.html' %}

{% block content %}

<div class="card shadow p-4">

    <h1>
        {{ post.title }}
    </h1>

    <p class="text-muted">
        By {{ post.author.username }}
        on {{ post.created_at.strftime('%Y-%m-%d') }}
    </p>

    <hr>

    <p style="white-space: pre-line;">
        {{ post.content }}
    </p>

</div>

{% endblock %}
